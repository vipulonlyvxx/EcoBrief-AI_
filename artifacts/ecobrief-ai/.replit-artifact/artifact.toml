kind = "web"
previewPath = "/"
title = "EcoBrief AI"
description = "A beginner-friendly environmental news summarizer for a college CHE110 project. Users paste an article to get a concise extractive summary and a transparent keyword-based topic category."
version = "1.0.0"
id = "artifacts/ecobrief-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21463

[services.development]
run = "pnpm --filter @workspace/ecobrief-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ecobrief-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/ecobrief-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21463"
BASE_PATH = "/"
